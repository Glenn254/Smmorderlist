<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Ordered List - KSP</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(to bottom right, #0099ff, #00cc99);
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 400px;
    }

    h2 {
      color: white;
      margin-bottom: 15px;
    }

    ul.order-list {
      list-style-type: decimal;
      text-align: left;
      padding-left: 20px;
      color: #d0ffd0;
      margin-bottom: 20px;
    }

    ul.order-list li {
      margin-bottom: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      border-radius: 10px;
    }

    .back {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>✅ Your Ordered List</h2>
    <ul id="orderList" class="order-list"></ul>
    <a href="index.html" class="back">← Back to Home</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
